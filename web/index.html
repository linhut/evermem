<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>恒忆 Evermem · 记忆管理</title>
<link rel="icon" type="image/x-icon" href="/brand/favicon.ico">
<link rel="apple-touch-icon" href="/brand/png/evermem-logo-128.png">
<style>
/* ============================================================
   1. 设计令牌（浅色为默认，深色为对等实现，非附属补丁）
   ============================================================ */
:root{
  /* 基础层 */
  --bg:#F7F7F8; --surface:#FFFFFF; --surface2:#F1F1F3; --surface3:#E9E9EC;
  --hairline:#E4E4E7; --hairline-2:#D4D4D8;
  --text:#18181B; --text2:#71717A; --text3:#A1A1AA;
  /* 语义层 */
  --accent:#C2410C; --accent-h:#9A3412; --accent-bg:#FFF2EA; --accent-line:#F7CDB6; --on-accent:#FFFFFF;
  --success:#0F7A5A; --success-bg:#E7F4EE; --success-line:#B7DFCD;
  --warning:#A16207; --warning-bg:#FBF2DE; --warning-line:#EBD79F;
  --danger:#C2262E;  --danger-bg:#FCE8E9;  --danger-line:#F1B9BC;
  --info:#185FA5;    --info-bg:#E9F1FB;    --info-line:#B4D0EE;
  --ai:#6D28D9;      --ai-bg:#F2ECFE;      --ai-line:#D8C7F8;
  /* 尺度 */
  --r-card:10px; --r-input:8px; --r-pill:999px; --r-list:8px;
  --shadow-1:0 1px 2px rgba(24,24,27,.05);
  --shadow-2:0 10px 30px rgba(24,24,27,.12);
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --font-mono:"Geist Mono","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.4,0,.2,1); --dur:.18s;
  /* 兼容旧命名（历史内联样式仍引用，勿删） */
  --card:var(--surface); --card2:var(--surface2); --border:var(--hairline);
  --blue:var(--info); --blue-h:#0C447C; --blue-bg:var(--info-bg); --blue-400:var(--info); --blue-200:var(--info-line);
  --green:var(--success); --green-bg:var(--success-bg); --teal:var(--success);
  --orange:var(--accent); --orange-bg:var(--accent-bg);
  --gold:var(--warning);  --gold-bg:var(--warning-bg);
  --red:var(--danger);    --red-bg:var(--danger-bg);
  --gray:var(--text3);    --gray-bg:var(--surface2);
  --radius:var(--r-card); --shadow:var(--shadow-1); --glass:var(--surface);
}
html[data-theme=dark]{
  --bg:#0A0A0A; --surface:#141416; --surface2:#1A1C20; --surface3:#212327;
  --hairline:#212327; --hairline-2:#2E3138;
  --text:#DADBDF; --text2:#7D8187; --text3:#5A5E66;
  --accent:#FF7A17; --accent-h:#FF9245; --accent-bg:#2A1A0B; --accent-line:#5C3413; --on-accent:#0A0A0A;
  --success:#5DCAA5; --success-bg:#0F2620; --success-line:#1E4A3C;
  --warning:#E8B04B; --warning-bg:#2A2110; --warning-line:#4A3A14;
  --danger:#F2555A;  --danger-bg:#2C1214;  --danger-line:#4E1E21;
  --info:#A0C3EC;    --info-bg:#101C28;    --info-line:#1E3348;
  --ai:#7C3AED;      --ai-bg:#171127;      --ai-line:#2E2150;
  --shadow-1:none; --shadow-2:0 12px 34px rgba(0,0,0,.6);
  --blue-h:#B5D4F4;
}

/* ============================================================
   2. 基础
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);font-size:14px;
     -webkit-font-smoothing:antialiased;transition:background .25s var(--ease),color .25s var(--ease)}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
#app{display:flex;height:100vh;overflow:hidden}

/* ============================================================
   3. 侧栏
   ============================================================ */
aside{width:240px;flex:0 0 240px;background:var(--surface);border-right:1px solid var(--hairline);
      display:flex;flex-direction:column;padding:16px 12px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 18px}
.brand .name{font-size:15px;font-weight:700;letter-spacing:.2px;line-height:1.2}
.brand .en{font-size:10.5px;color:var(--text2);font-family:var(--font-mono);letter-spacing:.06em}
.brand svg,.brand img{flex-shrink:0}
.nav-group{font-size:10.5px;font-family:var(--font-mono);letter-spacing:.14em;text-transform:uppercase;
           color:var(--text3);padding:12px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-input);cursor:pointer;
     color:var(--text2);font-size:13.5px;margin-bottom:2px;border:none;background:none;text-align:left;width:100%;
     transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.nav:hover{background:var(--surface2);color:var(--text)}
.nav.active{background:var(--accent-bg);color:var(--accent);font-weight:600}
.nav svg{width:17px;height:17px;fill:currentColor;flex-shrink:0;opacity:.9}
.nav.active svg{opacity:1}
aside .spacer{flex:1}
.side-card{border:1px solid var(--hairline);border-radius:var(--r-input);padding:10px;margin:10px 0 8px;
           background:var(--surface2)}
.side-card .row{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--text2)}
.side-card .row b{font-family:var(--font-mono);font-size:13px;color:var(--text);font-weight:600}
.side-card .st{font-family:var(--font-mono);font-size:10.5px;color:var(--text3);margin-top:6px;
               white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.theme-row{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-input);cursor:pointer;
           border:1px solid var(--hairline);background:transparent;color:var(--text2);font-size:12.5px;width:100%;
           transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.theme-row:hover{background:var(--surface2);color:var(--text)}
.theme-row svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}
.foot{font-family:var(--font-mono);font-size:10px;color:var(--text3);padding:10px;line-height:1.7;letter-spacing:.03em}

/* ============================================================
   4. 顶栏
   ============================================================ */
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.busybar{position:absolute;top:0;left:0;right:0;height:2px;overflow:hidden;z-index:20;
         opacity:0;transition:opacity .2s var(--ease);pointer-events:none}
.busybar.on{opacity:1}
.busybar i{position:absolute;top:0;left:-40%;width:40%;height:100%;background:var(--accent);
           animation:slide 1.1s var(--ease) infinite}
@keyframes slide{0%{left:-40%}100%{left:100%}}
header{display:flex;align-items:center;gap:10px;padding:0 20px;height:56px;flex:0 0 56px;
       background:var(--bg);border-bottom:1px solid var(--hairline);position:relative;z-index:5}
header h1{font-size:15px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.grow{flex:1}
.search-wrap{position:relative;width:320px;max-width:34vw}
.search-wrap>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;
                 fill:none;stroke:var(--text3);stroke-width:2;pointer-events:none}
.search{width:100%;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-pill);
        padding:7px 14px 7px 32px;font-size:13px;color:var(--text);outline:none;
        transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.search::placeholder{color:var(--text3)}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.kbd{font-family:var(--font-mono);font-size:10.5px;color:var(--text3);border:1px solid var(--hairline);
     border-radius:5px;padding:1px 6px;background:var(--surface)}

/* ============================================================
   5. 按钮
   ============================================================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;
     border:1px solid transparent;border-radius:var(--r-pill);font-size:13px;font-weight:500;cursor:pointer;
     white-space:nowrap;background:transparent;color:var(--text);
     transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),
                color var(--dur) var(--ease),transform .12s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.small{height:28px;padding:0 11px;font-size:12px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.primary:hover{background:var(--accent-h)}
.btn.ghost{background:transparent;color:var(--text2);border-color:var(--hairline-2)}
.btn.ghost:hover{color:var(--text);border-color:var(--text3);background:var(--surface2)}
.btn.plain{background:var(--surface2);color:var(--text);border-color:transparent}
.btn.plain:hover{background:var(--surface3)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger-line)}
.btn.danger:hover{background:var(--danger-bg)}
.btn.ghost.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-line)}
.btn[disabled],.btn.busy{opacity:.55;pointer-events:none}
.btn.busy::after{content:"";width:11px;height:11px;border:2px solid currentColor;border-right-color:transparent;
                 border-radius:50%;animation:spin .7s linear infinite;margin-left:2px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============================================================
   6. 内容区 / 卡片 / 列表
   ============================================================ */
#content{flex:1;overflow:auto;padding:20px 24px;display:flex;gap:16px;align-items:flex-start;
         animation:fadeIn .22s var(--ease)}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.col{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-card)}
.list-col{width:380px;flex:0 0 380px;display:flex;flex-direction:column;overflow:hidden;max-height:100%}
.detail-col{flex:1;overflow:hidden;display:flex;flex-direction:column;min-width:0;max-height:100%}
.list-head{padding:10px 12px;border-bottom:1px solid var(--hairline);display:flex;flex-direction:column;gap:8px}
.list-head .lh-top{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--text2)}
.list-head .lh-top b{font-family:var(--font-mono);color:var(--text);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;padding:3px 10px;border-radius:var(--r-pill);border:1px solid var(--hairline);
      color:var(--text2);background:transparent;cursor:pointer;transition:all var(--dur) var(--ease)}
.chip:hover{border-color:var(--hairline-2);color:var(--text)}
.chip.on{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent);font-weight:600}
.chip .n{font-family:var(--font-mono);opacity:.7;margin-left:3px}
#noteList{flex:1;overflow:auto;padding:8px}
.note-item{padding:10px 12px;border-radius:var(--r-list);cursor:pointer;margin-bottom:2px;
           border-left:2px solid transparent;position:relative;
           transition:background var(--dur) var(--ease),transform .12s var(--ease)}
.note-item:hover{background:var(--surface2)}
.note-item:active{transform:scale(.992)}
.note-item.active{background:var(--accent-bg);border-left-color:var(--accent)}
.note-item .t{font-size:13px;font-weight:500;line-height:1.45;overflow:hidden;
              display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.note-item .m{font-size:11px;color:var(--text2);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.note-item.active .t{color:var(--text)}
.badge{display:inline-block;padding:1px 8px;border-radius:var(--r-pill);font-size:10.5px;
       line-height:1.7;font-weight:500;white-space:nowrap}
.note-item.active .badge{background:var(--surface)!important;color:var(--text)!important}
.detail-top{padding:18px 22px 8px;overflow:auto;flex:1}
.detail-top h2{font-size:20px;font-weight:600;line-height:1.4;letter-spacing:.2px;margin-bottom:10px}
#body{color:var(--text);line-height:1.85;font-size:13.5px;margin-top:14px}
#body h3{font-size:14px;font-weight:600;margin:18px 0 6px;padding-left:10px;border-left:2px solid var(--accent)}
#body h4{font-size:13px;font-weight:600;margin:14px 0 4px;color:var(--text2)}
#body p{margin:5px 0}
#body pre{background:var(--surface2);border:1px solid var(--hairline);padding:10px;border-radius:var(--r-input);
          font-size:12px;overflow:auto;white-space:pre-wrap}
.meta{font-family:var(--font-mono);font-size:10.5px;color:var(--text2);margin:8px 0;word-break:break-all;
      letter-spacing:.02em}
.opbar{display:flex;gap:8px;padding:12px 22px;border-top:1px solid var(--hairline);flex-wrap:wrap;
       background:var(--surface);border-radius:0 0 var(--r-card) var(--r-card)}
.pane{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-card);padding:16px;margin-bottom:12px}
.pane h3{font-size:14px;font-weight:600;margin-bottom:8px;letter-spacing:.2px}
.pane .sub,.sub{font-size:12px;color:var(--text2);line-height:1.7}
.section-title{font-size:11.5px;font-family:var(--font-mono);letter-spacing:.12em;text-transform:uppercase;
               color:var(--text3);margin:18px 0 8px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
/* 复选框标签（候选审核批量选择）：与 12.5px 正文同字号，整块可点 */
.ck{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text2);
    cursor:pointer;user-select:none;line-height:1.5}
.ck input[type=checkbox]{width:14px;height:14px;margin:0;accent-color:var(--accent);cursor:pointer}
.ck:hover{color:var(--text)}

/* 分段控件（同一模块内切换来源）：与按钮/卡片同圆角同描边，只靠底色区分选中 */
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--hairline);
     border-radius:var(--r-input);padding:2px;gap:2px}
.seg-btn{border:0;background:transparent;color:var(--text2);font:inherit;font-size:12.5px;
         padding:5px 14px;border-radius:calc(var(--r-input) - 2px);cursor:pointer;line-height:1.5}
.seg-btn:hover{color:var(--text)}
.seg-btn.on{background:var(--surface);color:var(--text);font-weight:500;
            box-shadow:0 1px 2px rgba(0,0,0,.06)}

/* 空状态 / 骨架 / 错误 */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
       color:var(--text2);text-align:center;padding:44px 16px;font-size:12.5px;line-height:1.7}
.empty svg{width:34px;height:34px;fill:none;stroke:var(--text3);stroke-width:1.4;opacity:.9}
.empty .eh{font-size:13px;font-weight:500;color:var(--text)}
.skel{padding:10px 12px;margin-bottom:2px}
.skel i{display:block;height:11px;border-radius:5px;background:var(--surface2);position:relative;overflow:hidden}
.skel i+i{margin-top:8px;width:56%}
.skel i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--surface3),transparent);
               animation:shimmer 1.2s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.errbox{border:1px solid var(--danger-line);background:var(--danger-bg);color:var(--danger);
        border-radius:var(--r-input);padding:12px 14px;font-size:12.5px;line-height:1.7}

/* 统计 */
.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:100%}
.stat-card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-card);padding:16px}
.stat-card .n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1.2}
.stat-card .l{font-size:11.5px;color:var(--text2);margin-top:6px}
.stat-card .d{font-family:var(--font-mono);font-size:10.5px;color:var(--text3);margin-top:4px}
.dist{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;width:100%;margin-top:12px}
.dist-card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-card);padding:16px}
.dist-card h4{font-size:12.5px;font-weight:600;margin-bottom:12px}
.bar-row{margin-bottom:12px}
.bar-row:last-child{margin-bottom:0}
.bar-row .bl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;color:var(--text2)}
.bar-row .bl b{font-family:var(--font-mono);color:var(--text);font-weight:600}
.bar{height:6px;border-radius:var(--r-pill);background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:var(--r-pill);background:var(--accent);
       transition:width .5s var(--ease)}
.bar.s i{background:var(--success)} .bar.w i{background:var(--warning)}
.bar.i i{background:var(--info)}    .bar.g i{background:var(--text3)}
.hot-card{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);
          border:1px solid var(--hairline);border-radius:var(--r-card);padding:12px 16px;margin-bottom:8px}

/* 接入设置行 */
.host-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--hairline)}
.host-row:last-child{border-bottom:none}
.host-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-ok{background:var(--success)} .dot-no{background:var(--text3)}

/* 表单 */
select,input[type=text],input[type=number],input[type=password]{background:var(--surface);
  border:1px solid var(--hairline);border-radius:var(--r-input);padding:7px 11px;font-size:13px;color:var(--text);
  outline:none;transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);max-width:100%}
select:focus,input[type=text]:focus,input[type=number]:focus,input[type=password]:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
input:not([type=checkbox]){height:32px}
.field{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--text2);min-width:0}
.field input,.field select{width:100%}
.dash-card{border:1px dashed var(--hairline-2);border-radius:var(--r-card);padding:18px;text-align:center;
           color:var(--text2);font-size:12.5px;background:transparent;cursor:pointer;width:100%;
           transition:border-color var(--dur) var(--ease),color var(--dur) var(--ease)}
.dash-card:hover{border-color:var(--accent);color:var(--accent)}
pre.out{background:var(--surface2);border:1px solid var(--hairline);border-radius:var(--r-input);padding:10px;
        font-size:11.5px;overflow:auto;max-height:200px;white-space:pre-wrap;line-height:1.6;
        font-family:var(--font-mono)}
.log-box{font-family:var(--font-mono);font-size:11px;line-height:1.75;color:var(--text2);
         background:var(--surface2);border:1px solid var(--hairline);border-radius:var(--r-input);
         padding:12px;max-height:220px;overflow:auto;white-space:pre-wrap}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(10,10,10,.42);display:none;align-items:center;justify-content:center;
            z-index:99;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);transition:opacity .18s var(--ease)}
.modal-mask.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--hairline);border-radius:14px;width:580px;max-width:92vw;
       padding:22px 24px;box-shadow:var(--shadow-2);transform:translateY(10px) scale(.985);
       transition:transform .22s var(--ease),opacity .18s var(--ease)}
.modal-mask.show .modal{transform:none}
.modal-sm{width:420px}
.modal h3{font-size:15px;font-weight:600;margin-bottom:12px}
.modal label{display:block;font-size:11.5px;color:var(--text2);margin:12px 0 5px}
.modal input,.modal textarea,.modal select{width:100%;border:1px solid var(--hairline);border-radius:var(--r-input);
      padding:8px 11px;font-size:13px;outline:none;background:var(--surface);color:var(--text)}
.modal input:focus,.modal textarea:focus,.modal select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.modal textarea{height:170px;resize:vertical;line-height:1.7}
.modal .row{display:flex;gap:10px}
.modal .row>*{flex:1;min-width:0}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.cf-msg{font-size:13px;color:var(--text2);line-height:1.8;white-space:pre-wrap}
.cf-warn{margin-top:10px;padding:9px 11px;border-radius:var(--r-input);background:var(--danger-bg);
         border:1px solid var(--danger-line);color:var(--danger);font-size:12px;line-height:1.7}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);display:flex;align-items:center;gap:9px;
       background:var(--surface);border:1px solid var(--hairline-2);color:var(--text);padding:10px 16px;
       border-radius:var(--r-pill);font-size:12.5px;box-shadow:var(--shadow-2);
       opacity:0;pointer-events:none;transition:all .26s var(--ease);z-index:100;max-width:78vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .dot{width:7px;height:7px;border-radius:50%;background:var(--text3);flex-shrink:0}
.toast.success{border-color:var(--success-line)} .toast.success .dot{background:var(--success)}
.toast.danger{border-color:var(--danger-line)}  .toast.danger .dot{background:var(--danger)}
.toast.info{border-color:var(--info-line)}      .toast.info .dot{background:var(--info)}
.toast.warning{border-color:var(--warning-line)}.toast.warning .dot{background:var(--warning)}

/* 滚动条 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--hairline-2);border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--text3);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* 备份渠道 · 行式列表（设计稿 02：名称+meta+状态徽标，展开即编辑） */
.bkrow{margin-bottom:8px}
.bkrow summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-list);cursor:pointer;list-style:none;transition:border-color .18s var(--ease)}
.bkrow summary::-webkit-details-marker{display:none}
.bkrow[open] summary{border-color:var(--accent-line)}
.bkrow summary:hover{border-color:var(--accent);background:var(--surface2)}
.bkrow .pane{box-shadow:none}
.bkrow-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bkcheck{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);white-space:nowrap}
.bkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}

/* 字段卡 —— 对应设计稿 03 的「Endpoint · 区域 / AccessKey ID · Secret / Bucket · 前缀路径」
   一张卡承载一组语义相邻字段，卡片内标签 11px、值 13px 等宽 */
.bkfield{background:var(--surface2);border-radius:var(--r-input);padding:10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.bkflabel{font-size:11px;color:var(--text2);line-height:1.4}
.bkflabel em{font-style:normal;color:var(--danger)}
.bkfrow{display:flex;gap:8px;align-items:center;min-width:0}
.bkfrow input{min-width:0;flex:1;background:transparent;border:none;padding:0;font-family:var(--font-mono);font-size:13px;color:var(--text)}
.bkfrow input:focus{outline:none;box-shadow:0 0 0 2px var(--accent-line)}
.bkfrow input::placeholder{font-family:var(--font-sans);font-size:12px;color:var(--text3)}
.bkfhint{font-size:10.5px;color:var(--text3);line-height:1.5}

/* 服务商 chip —— pill 形态 / 高 33px，选中态用 --on-accent 保证明暗双主题都可读 */
.bkchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bkchip{height:33px;padding:0 14px;display:inline-flex;align-items:center;border:none;cursor:pointer;
        border-radius:var(--r-pill);background:var(--surface2);color:var(--text);font-size:12px;
        font-family:inherit;transition:background .18s var(--ease),color .18s var(--ease)}
.bkchip:hover{background:var(--surface3)}
.bkchip.active{background:var(--accent);color:var(--on-accent);font-weight:500}
.bkpick{cursor:pointer;transition:border-color .18s var(--ease),background .18s var(--ease)}
.bkpick:hover{border-color:var(--accent);background:var(--surface2)}

/* 安全提示 —— 设计稿 03 的绿色信息条 */
.bktip{margin-top:10px;padding:12px;border-radius:var(--r-input);font-size:12px;
       background:var(--success-bg);color:var(--success);line-height:1.6}
.bktip.warn{background:var(--warning-bg);color:var(--warning)}
.bkline{margin-top:8px;font-size:12px;line-height:1.6}
.bkline.danger{color:var(--danger)}
.bkline.warning{color:var(--warning)}

/* 向导步骤条 —— 副标题「步骤 2 / 4」的可视化 */
.bkstepper{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.bkstepper i{width:14px;height:1px;background:var(--hairline-2);display:inline-block}
.bkstep{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;color:var(--text3)}
.bkstep.done{color:var(--success)}
.bkstep.on{color:var(--accent);font-weight:600}
.bkwiz-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.bksumrow{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--hairline);font-size:12px}
.bksumrow span{color:var(--text2)}
.bksumrow b{max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand">
      <img src="/brand/evermem-logo.svg" width="28" height="28" alt="恒忆" title="恒忆 Evermem">
      <div><div class="name">恒忆</div><div class="en">EVERMEM</div></div>
    </div>

    <div class="nav-group" data-i18n="记忆">记忆</div>
    <button class="nav active" data-view="browse"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm4 3h8v2H8zm0 4h5v2H8z"/></svg><span data-i18n="记忆浏览">记忆浏览</span></button>
    <button class="nav" data-view="triage"><svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg><span data-i18n="候选审核">候选审核</span></button>
    <button class="nav" data-view="import"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-7-7z"/></svg><span data-i18n="数据导入">数据导入</span></button>

    <div class="nav-group" data-i18n="系统">系统</div>
    <button class="nav" data-view="hot"><svg viewBox="0 0 24 24"><path d="M12 2s5 4.5 5 9a5 5 0 0 1-10 0c0-1.6.7-3.1 1.8-4.3C9.2 8.4 9 9.7 9 11a3 3 0 0 0 6 0c0-3.5-3-9-3-9z"/></svg><span data-i18n="核心经验">核心经验</span></button>
    <button class="nav" data-view="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10h4v10zm6 0V4h4v16zm6 0v-7h4v7z"/></svg><span data-i18n="统计诊断">统计诊断</span></button>
    <button class="nav" data-view="integ"><svg viewBox="0 0 24 24"><path d="M9 8V6a3 3 0 0 1 6 0v2h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2zm2 0h2V6a1 1 0 0 0-2 0z"/></svg><span data-i18n="接入设置">接入设置</span></button>
    <button class="nav" data-view="maint"><svg viewBox="0 0 24 24"><path d="M6 3h12v2.6H6zM6 5.6c0 1.6 2.7 2.9 6 2.9s6-1.3 6-2.9V18c0 1.6-2.7 2.9-6 2.9S6 19.6 6 18z"/></svg><span data-i18n="数据与维护">数据与维护</span></button>
    <button class="nav" data-view="backup"><svg viewBox="0 0 24 24"><path d="M12 3a7 7 0 0 0-5 11.6l1.4-1.4A5 5 0 1 1 12 7a5 5 0 0 1 4.5 2.9L18 11a7 7 0 0 0-6-8zm0 4-3 3h2v4h2v-4h2zm5 6-3 3h2v4h2v-4h2z"/></svg><span data-i18n="数据备份">数据备份</span></button>
    <button class="nav" data-view="update"><svg viewBox="0 0 24 24"><path d="M11 3h2v9.2l3.3-3.3 1.4 1.4L12 16 6.3 10.3l1.4-1.4L11 12.2zM5 18h14v2H5z"/></svg><span data-i18n="版本与更新">版本与更新</span></button>

    <div class="spacer"></div>
    <div class="side-card" id="sideStat">
      <div class="row"><span data-i18n="记忆">记忆</span><b id="sideTotal">—</b></div>
      <div class="st" id="sideIndex" data-i18n="索引读取中…">索引读取中…</div>
    </div>
    <button class="theme-row" id="langBtn" style="margin-bottom:8px"><svg id="langFlag" viewBox="0 0 24 24" width="15" height="15" style="fill:currentColor"><text x="4" y="16">中</text><text x="14" y="16" style="font-weight:400">EN</text></svg><span id="langLabel">EN</span></button>
    <button class="theme-row" id="themeBtn"><svg id="themeIco" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg><span id="themeLabel" data-i18n="深色模式">深色模式</span></button>
    <div class="foot">Jose-AI · MIT<br data-i18n="本地 · 零云端">本地 · 零云端</div>
  </aside>

  <main>
    <div class="busybar" id="busyBar"><i></i></div>
    <header>
      <h1 id="viewTitle" data-i18n="记忆浏览">记忆浏览</h1>
      <div class="search-wrap" id="searchWrap" style="display:none">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="search" class="search" placeholder="搜索记忆…（融合通信 / 方案 / 公文）" data-i18n-ph="搜索记忆…（融合通信 / 方案 / 公文）">
      </div>
      <button class="btn ghost small" id="allBtn" style="display:none" data-i18n="含候选">含候选</button>
      <button class="btn primary small" id="newBtn" style="display:none" data-i18n="＋ 新建">＋ 新建</button>
      <div class="grow"></div>
      <span class="kbd" id="kbdHint">Ctrl K</span>
    </header>
    <div id="content"></div>
  </main>
</div>

<div class="modal-mask" id="modalMask"><div class="modal">
  <h3 id="modalTitle" data-i18n="新建记忆">新建记忆</h3>
  <label data-i18n="标题">标题</label><input id="fTitle" placeholder="一句话标题" data-i18n-ph="一句话标题">
  <div class="row">
    <div><label data-i18n="类型">类型</label><select id="fType"><option value="lesson" data-i18n="经验">经验</option><option value="procedure" data-i18n="配方">配方</option><option value="fact" data-i18n="事实">事实</option></select></div>
    <div><label data-i18n="状态">状态</label><select id="fStatus"><option value="staged" data-i18n="staged（候选）">staged（候选）</option><option value="active">active</option><option value="suspect">suspect</option><option value="superseded">superseded</option></select></div>
  </div>
  <label data-i18n="标签（逗号分隔）">标签（逗号分隔）</label><input id="fTags" placeholder="方案, 应急">
  <label data-i18n="正文（Markdown）">正文（Markdown）</label><textarea id="fBody" placeholder="问题 → 无效做法 → 已验证做法 → 适用范围"></textarea>
  <div class="actions"><button class="btn ghost" id="cancelBtn" data-i18n="取消">取消</button><button class="btn primary" id="saveBtn" data-i18n="保存">保存</button></div>
</div></div>

<div class="modal-mask" id="viewMask"><div class="modal">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <h3 id="viewModalTitle" style="margin:0"></h3><button class="btn ghost small" onclick="closeView()" data-i18n="关闭">关闭</button></div>
  <pre id="viewBody" style="white-space:pre-wrap;font-size:12.5px;line-height:1.8;max-height:56vh;overflow:auto"></pre>
  <div class="actions" id="viewActions" style="display:none"></div>
</div></div>

<!-- 新增渠道向导：骨架在此，内容由渠道模块 channel.js 按步骤渲染 -->
<div class="modal-mask" id="bkWizard"></div>

<div class="modal-mask" id="confirmMask"><div class="modal modal-sm">
  <h3 id="cfTitle" data-i18n="确认操作">确认操作</h3>
  <div class="cf-msg" id="cfMsg"></div>
  <div class="actions"><button class="btn ghost" id="cfCancel" data-i18n="取消">取消</button><button class="btn danger" id="cfOk" data-i18n="确认">确认</button></div>
</div></div>

<!-- 首次使用引导（onboarding）：首次启动自动弹出，可跳过；localStorage['pmem-onboarded'] 记录 -->
<div class="modal-mask" id="onboardMask">
  <div class="modal" style="max-width:560px">
    <h3 id="obTitle" style="margin-bottom:10px">欢迎使用恒忆 Evermem</h3>
    <div id="obBody" style="min-height:200px;font-size:13px;line-height:1.9;color:var(--text)"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px">
      <button class="btn ghost small" id="obSkip" data-i18n="跳过引导">跳过引导</button>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn ghost small" id="obPrev" style="display:none" data-i18n="上一步">上一步</button>
        <button class="btn primary small" id="obNext">下一步</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toastMsg"></span></div>
<script src="i18n.js?v=20260929a"></script>
<script src="channel.js?v=20260929a"></script>
<script src="index.js?v=20260929a"></script>
</body>
</html>

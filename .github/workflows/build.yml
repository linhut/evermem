name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# 仓库根 = 项目根（恒忆源码直接位于仓库根）
# 产物约定（客户端 update.py _asset_matches 与此保持一致）：
#   绿色版：Evermem-<plat>-vX-portable.zip / .app.zip / .tar.gz（onedir，解压即用）
#   安装版：Evermem-setup-vX.exe（Inno）/ Evermem-macos-vX.dmg / Evermem-linux-vX.deb、.rpm
# 更新清单 update-manifest.json 不进 Release、不由 CI 生成：云服务器固定文件（见 update.py 注释）
jobs:
  build:
    name: 打包 ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            plat: windows-x64
            sep: ";"
            exe: ".exe"
            artifact: Evermem-windows
            icon: "--icon assets/icon.ico"
            version_file: "--version-file assets/version_info.txt"
            smoke: "Evermem/Evermem.exe"
          - os: ubuntu-latest
            label: linux
            plat: linux-x64
            sep: ":"
            exe: ""
            artifact: Evermem-linux
            icon: ""
            version_file: ""
            smoke: "Evermem/Evermem"
          - os: macos-latest
            label: macos
            plat: macos-arm64
            sep: ":"
            exe: ""
            artifact: Evermem-macos
            icon: "--icon assets/icon.icns"
            version_file: ""
            smoke: "Evermem.app/Contents/MacOS/Evermem"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # PyInstaller + PySide6 在 3.12 三平台 wheel 最稳定
          python-version: "3.12"
          cache: pip
          # 默认只匹配 requirements.txt / pyproject.toml，这里指向实际锁文件（仓库根相对路径）
          cache-dependency-path: requirements-build.txt

      - name: 安装构建期依赖
        run: pip install -r requirements-build.txt

      - name: Ubuntu 补 Qt 运行时系统库
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-xinerama0 libxrandr2 libxfixes3 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: 生成 Windows 版本信息
        if: matrix.os == 'windows-latest'
        shell: bash  # 必需：Windows runner 默认 pwsh 不认 heredoc（曾报 Missing file specification）
        run: |
          python - <<'PY'
          from pathlib import Path
          raw = Path('VERSION').read_text(encoding='utf-8').strip()
          ver = raw.split('.') + ['0']
          ver = tuple(int(x) for x in ver[:4])
          vs = '.'.join(map(str, ver))
          text = f'''VSVersionInfo(
            ffi=FixedFileInfo(
              filevers={ver}, prodvers={ver}, mask=0x3f, flags=0x0, OS=0x40004,
              fileType=0x1, subtype=0x0, date=(0, 0)
            ),
            kids=[
              StringFileInfo([
                StringTable('040904B0', [
                  StringStruct('CompanyName', 'Jose-AI'),
                  StringStruct('FileDescription', '恒忆 Evermem'),
                  StringStruct('FileVersion', '{vs}'),
                  StringStruct('InternalName', 'Evermem'),
                  StringStruct('LegalCopyright', 'Copyright (c) 2026 Jose-AI · MIT License'),
                  StringStruct('OriginalFilename', 'Evermem.exe'),
                  StringStruct('ProductName', '恒忆 Evermem'),
                  StringStruct('ProductVersion', '{vs}')
                ])
              ]),
              VarFileInfo([VarStruct('Translation', [1033, 1200])])
            ]
          )'''
          Path('assets/version_info.txt').write_text(text, encoding='utf-8')
          PY

      - name: 构建桌面壳（onedir 绿色版：免安装、解压即用、不写注册表/系统服务）
        # 单行书写（Windows Git Bash 不吃 \ 续行）；--paths web 让分析器找到 import server；
        # add-data 打包前端资源与模板（冻结态定位见 server.py / desktop.py）。
        # --hidden-import paths：数据/代码目录唯一解析入口，被各模块动态引用，
        # 分析器扫不到会导致打包产物启动即 ModuleNotFoundError。
        # onedir 替代 onefile：消除"每次启动全量解包 219MB"造成的打开慢（杀软实时扫描叠加更甚）。
        run: pyinstaller --onedir --windowed --name Evermem --paths web --hidden-import paths --add-data "web${{ matrix.sep }}web" --add-data "templates${{ matrix.sep }}templates" --add-data "VERSION${{ matrix.sep }}." --add-data "scripts${{ matrix.sep }}scripts" --add-data "brand${{ matrix.sep }}brand" ${{ matrix.icon }} ${{ matrix.version_file }} desktop.py

      - name: GUI 冒烟（--smoke 自退并断言退出码 0）
        shell: bash
        run: |
          # 桌面壳带 --smoke：内嵌服务就绪 + 窗口加载 6s 后自动退出，退出码 0 才算通过
          # 数据根指向临时目录：避免冒烟把运行时数据写进 dist/ 混入 Release（2026-10-01 发布事故）。
          export PMEM_HOME="$RUNNER_TEMP/pmem-smoke-${{ github.run_id }}"
          mkdir -p "$PMEM_HOME"
          export PMEM_NO_AUTO_HARVEST=1
          if [ "${{ matrix.os }}" != "windows-latest" ]; then
            export QT_QPA_PLATFORM=offscreen
            export QTWEBENGINE_CHROMIUM_FLAGS="--no-sandbox --disable-gpu --disable-dev-shm-usage"
          fi
          ./dist/${{ matrix.smoke }} --smoke &
          PID=$!
          rc=""
          i=0
          while [ $i -lt 90 ]; do
            if ! kill -0 "$PID" 2>/dev/null; then wait "$PID"; rc=$?; break; fi
            i=$((i+1)); sleep 1
          done
          if [ -z "$rc" ]; then echo "GUI 超时未退出"; kill "$PID" 2>/dev/null; exit 1; fi
          if [ "$rc" -ne 0 ]; then echo "GUI 冒烟失败 rc=$rc"; exit 1; fi
          echo "GUI 冒烟通过（服务就绪并正常退出）"

      - name: Linux AppImage（可选增强：自带 Qt 库；失败不阻塞发布，见 docs/CODE-SIGNING.md）
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        shell: bash
        run: |
          set -e
          sudo apt-get install -y -qq file desktop-file-utils
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O /tmp/linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O /tmp/linuxdeploy-plugin-qt
          chmod +x /tmp/appimagetool /tmp/linuxdeploy /tmp/linuxdeploy-plugin-qt
          mkdir -p AppDir/opt/evermem AppDir/usr/bin AppDir/usr/share/applications
          # 必须拷整个 onedir 目录：只拷 Evermem 二进制会在 AppDir 里找不到 _internal，跑不起来
          cp -r dist/Evermem/. AppDir/opt/evermem/
          printf '#!/bin/sh\nexec /opt/evermem/Evermem "$@"\n' > AppDir/usr/bin/evermem
          chmod 0755 AppDir/usr/bin/evermem
          cat > AppDir/usr/share/applications/evermem.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=恒忆 Evermem
          Comment=个人跨会话经验记忆系统
          Exec=evermem
          Icon=evermem
          Categories=Utility;
          Terminal=false
          EOF
          # PySide6 的 Qt 库定位：linuxdeploy-plugin-qt 用 QMAKE 探测（WebEngine 体积大，AppImage 约 200-250MB）
          export QMAKE="$(python -c 'import PySide6, os; print(os.path.join(os.path.dirname(PySide6.__file__), "qmake"))' 2>/dev/null || true)"
          export PATH="/tmp:$PATH"
          # 注意：工具在 /tmp，不是当前目录。原写法 ./linuxdeploy 必然 "No such file"（AppImage 从未产出过）。
          # runner 上通常没有 FUSE，加 --appimage-extract-and-run 走解压执行。
          linuxdeploy --appimage-extract-and-run --appdir AppDir \
            --executable AppDir/opt/evermem/Evermem --plugin qt --output appimage \
            -i assets/icon.png \
            || { echo "[appimage] 构建失败（continue-on-error 放行，不影响发布；绿色版 tar.gz 仍随 Release 分发）"; exit 0; }
          ls -1 *.AppImage 2>/dev/null || true
          # 放进 dist/ 使其随 Release 上传（重命名步骤会改成 Evermem-linux-vX.AppImage）
          cp -f *.AppImage dist/ 2>/dev/null || true

      - name: Windows 安装版（Inno Setup 安装向导 + 卸载数据保留对话框）
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          choco install innosetup -y --no-progress
          ISCC="$(ls -d /c/Program\ Files*/Inno*Setup*/ISCC.exe 2>/dev/null | head -1)"
          [ -n "$ISCC" ] || { echo "[installer] Inno ISCC 未找到"; exit 1; }
          SRC="$(cygpath -w "$PWD/dist/Evermem")"
          OUT="$(cygpath -w "$PWD/dist")"
          # MSYS 会把以 / 开头的参数（/DMyAppVersion=...）当路径转换，iscc 会立即退出
          # （只打印版本行）。禁用参数路径转换后再调用。
          MSYS_NO_PATHCONV=1 "$ISCC" installers/windows/evermem.iss \
            /DMyAppVersion="$(cat VERSION)" /DMySourceDir="$SRC" /DMyOutputDir="$OUT"
          ls -1 dist

      - name: macOS dmg / Linux deb、rpm（可选增强，失败不阻塞发布）
        if: matrix.os != 'windows-latest'
        continue-on-error: true
        shell: bash
        run: |
          bash scripts/make_installers.sh "${{ matrix.label }}" "$(cat VERSION)" dist
          ls -1 dist

      - name: 产物重命名与绿色版打包（onedir 目录 → zip/tar.gz + 校验文件）
        shell: bash
        run: |
          cd dist
          VER="${GITHUB_REF_NAME#v}"
          FILE_VER="$(cat ../VERSION)"
          # 非 tag 触发（workflow_dispatch）时 GITHUB_REF_NAME 是分支名，改用 VERSION 文件
          if [ "$VER" = "${GITHUB_REF_NAME}" ]; then VER="$FILE_VER"; fi
          # tag 与 VERSION 必须一致：不一致说明漏改版本号，直接失败而不是产出错误版本号
          if [ "$VER" != "$FILE_VER" ]; then
            echo "tag 与 VERSION 不一致：tag=$VER VERSION=$FILE_VER"; exit 1
          fi
          if [ "${{ matrix.label }}" = "macos" ]; then
            # 绿色版：.app 目录打 zip（onedir 直接产出 .app；裸二进制 Evermem 一并清理，
            # 否则 sha256sum * 遇目录报错导致步骤失败）
            zip -qry "Evermem-macos-v$VER.app.zip" Evermem.app
            rm -rf Evermem.app Evermem
          elif [ "${{ matrix.label }}" = "windows" ]; then
            # 绿色版：onedir 目录（Evermem.exe + _internal/）打 zip，解压即用。
            # 注意：Windows runner 的 Git Bash 没有 zip 命令，用 Python zipfile 打包。
            python - <<PY
          import shutil
          shutil.make_archive("Evermem-windows-v$VER-portable", "zip", ".", "Evermem")
          PY
            rm -rf Evermem
          else
            # 绿色版：onedir 目录打 tar.gz
            tar -czf "Evermem-linux-v$VER-portable.tar.gz" Evermem
            rm -rf Evermem
          fi
          # 安装版产物带版本名（Inno 输出 Evermem-setup.exe；dmg/deb/rpm 已带版本名）
          if [ -f "Evermem-setup.exe" ]; then mv -f "Evermem-setup.exe" "Evermem-setup-v$VER.exe"; fi
          # Linux AppImage 改名（可选增强，失败不影响）
          if [ "${{ matrix.label }}" = "linux" ]; then
            if ls *.AppImage >/dev/null 2>&1; then mv -f *.AppImage "Evermem-linux-v$VER.AppImage"; fi
          fi
          # 生成校验文件（先压缩打包完再写，避免把自己算进去）
          # 注意：这只是本平台的局部清单，会被后面 checksums 作业的统一清单覆盖；
          # 因此不随本作业上传 Release（见下方上传步骤的排除列表），避免"只有 Windows 哈希"。
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS.txt
          else
            shasum -a 256 * > SHA256SUMS.txt
          fi
          ls -1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # uses 步骤不受 defaults.working-directory 影响，路径相对仓库根
          path: |
            dist/*
          if-no-files-found: error

      - name: 确保 GitHub Release 存在（tag 触发时自动创建）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash  # 必需：Windows runner 默认 pwsh 不认 `if ! cmd` 语法
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Evermem (恒忆) v${TAG#v}" --generate-notes
          fi

      - name: 上传二进制到 Release（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          # 只上传平台产物：排除冒烟可能残留的运行时数据（与 find_asset 同名单，防御纵深），
          # 并排除本平台的 SHA256SUMS.txt —— 统一清单由 checksums 作业生成后上传，
          # 否则三个平台互相 clobber，最终只剩最后一个平台（Windows）的哈希。
          ASSETS=$(ls -1 | grep -vE '^(index\.json|harvest_state\.json|corpus_spaces\.json|kb\.json|knowledge-base\.md|pmem_config\.json|pmem_backup\.json|\.pmem-backup-last\.json|\.recipe-lock\.json|update_state\.json|backup\.log|SHA256SUMS\.txt)$')
          echo "$ASSETS" | xargs -r gh release upload "${GITHUB_REF_NAME}" --clobber

  # 统一校验清单：三个平台各自的 SHA256SUMS.txt 只含本平台产物，必须汇总后覆盖上传。
  checksums:
    name: 统一 SHA256SUMS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          # 不加 merge-multiple：三个平台各自落到 dist-all/<artifact-name>/，
          # 同名文件（各平台的 SHA256SUMS.txt）不会互相覆盖。
          pattern: Evermem-*
          path: dist-all

      - name: 生成跨平台统一清单
        shell: bash
        run: |
          cd dist-all
          rm -f */SHA256SUMS.txt
          # 用 Python 而不是 sha256sum *：产物分散在子目录里，且要只写文件名
          # （用户下载后在同一目录执行 sha256sum -c，路径必须平铺）
          python3 - <<PY
          import hashlib, pathlib
          root = pathlib.Path('.')
          lines = []
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  h = hashlib.sha256(p.read_bytes()).hexdigest()
                  lines.append(f"{h}  {p.name}")
          (root / 'SHA256SUMS.txt').write_text("\n".join(lines) + "\n", encoding='utf-8')
          print("\n".join(lines))
          PY
          # 产物数为 0 说明三个平台都没出包，直接失败而不是上传空清单
          if [ "$(grep -c . SHA256SUMS.txt)" -eq 0 ]; then echo "无产物可校验"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: Evermem-checksums
          path: dist-all/SHA256SUMS.txt
          if-no-files-found: error

      - name: 上传统一清单到 Release（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist-all
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS.txt --clobber

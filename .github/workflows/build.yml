name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# 仓库根 = 项目根（恒忆源码直接位于仓库根）
jobs:
  build:
    name: 打包 ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            sep: ";"
            exe: ".exe"
            artifact: evermem-windows
          - os: ubuntu-latest
            label: linux
            sep: ":"
            exe: ""
            artifact: evermem-linux
          - os: macos-latest
            label: macos
            sep: ":"
            exe: ""
            artifact: evermem-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # PyInstaller + PySide6 在 3.12 三平台 wheel 最稳定
          python-version: "3.12"
          cache: pip
          # 默认只匹配 requirements.txt / pyproject.toml，这里指向实际锁文件（仓库根相对路径）
          cache-dependency-path: requirements-build.txt

      - name: 安装构建期依赖
        run: pip install -r requirements-build.txt

      - name: Ubuntu 补 Qt 运行时系统库
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-xinerama0 libxrandr2 libxfixes3 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: 构建桌面壳（PySide6 + QtWebEngine，内嵌 Web 服务；单包即完整产品）
        # 单行书写（Windows Git Bash 不吃 \ 续行）；--paths web 让分析器找到 import server；
        # add-data 打包前端资源与模板（冻结态定位见 server.py / desktop.py）
        run: pyinstaller --onefile --windowed --name evergem --paths web --add-data "web${{ matrix.sep }}web" --add-data "templates${{ matrix.sep }}templates" desktop.py

      - name: GUI 冒烟（--smoke 自退并断言退出码 0）
        shell: bash
        run: |
          # 桌面壳带 --smoke：内嵌服务就绪 + 窗口加载 6s 后自动退出，退出码 0 才算通过
          if [ "${{ matrix.os }}" != "windows-latest" ]; then
            export QT_QPA_PLATFORM=offscreen
            export QTWEBENGINE_CHROMIUM_FLAGS="--no-sandbox --disable-gpu --disable-dev-shm-usage"
          fi
          ./dist/evergem${{ matrix.exe }} --smoke &
          PID=$!
          rc=""
          i=0
          while [ $i -lt 90 ]; do
            if ! kill -0 "$PID" 2>/dev/null; then wait "$PID"; rc=$?; break; fi
            i=$((i+1)); sleep 1
          done
          if [ -z "$rc" ]; then echo "GUI 超时未退出"; kill "$PID" 2>/dev/null; exit 1; fi
          if [ "$rc" -ne 0 ]; then echo "GUI 冒烟失败 rc=$rc"; exit 1; fi
          echo "GUI 冒烟通过（服务就绪并正常退出）"

      - name: 产物重命名（每平台单个运行包；macOS 打 .app.zip）
        shell: bash
        run: |
          cd dist
          VER="${GITHUB_REF_NAME#v}"
          if [ "${{ matrix.label }}" = "macos" ]; then
            # macOS onefile 同时产出裸可执行文件与 .app 目录；gh 不能上传目录，把 .app 打成 zip
            zip -qry evergem-macos-v$VER.app.zip evergem.app
            rm -rf evergem.app evergem
          else
            mv -f evergem${{ matrix.exe }} evergem-${{ matrix.label }}-v$VER${{ matrix.exe }}
          fi
          ls -1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # uses 步骤不受 defaults.working-directory 影响，路径相对仓库根
          path: dist/*
          if-no-files-found: error

      - name: 上传二进制到 Release（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
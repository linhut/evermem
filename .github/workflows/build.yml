name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# 仓库根 = 项目根（恒忆源码直接位于仓库根）
jobs:
  build:
    name: 打包 ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            plat: windows-x64
            sep: ";"
            exe: ".exe"
            artifact: Evermem-windows
            icon: "--icon assets/icon.ico"
            version_file: "--version-file assets/version_info.txt"
          - os: ubuntu-latest
            label: linux
            plat: linux-x64
            sep: ":"
            exe: ""
            artifact: Evermem-linux
            icon: ""
            version_file: ""
          - os: macos-latest
            label: macos
            plat: macos-arm64
            sep: ":"
            exe: ""
            artifact: Evermem-macos
            icon: "--icon assets/icon.icns"
            version_file: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # PyInstaller + PySide6 在 3.12 三平台 wheel 最稳定
          python-version: "3.12"
          cache: pip
          # 默认只匹配 requirements.txt / pyproject.toml，这里指向实际锁文件（仓库根相对路径）
          cache-dependency-path: requirements-build.txt

      - name: 安装构建期依赖
        run: pip install -r requirements-build.txt

      - name: Ubuntu 补 Qt 运行时系统库
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-xinerama0 libxrandr2 libxfixes3 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: 生成 Windows 版本信息
        if: matrix.os == 'windows-latest'
        shell: bash  # 必需：Windows runner 默认 pwsh 不认 heredoc（曾报 Missing file specification）
        run: |
          python - <<'PY'
          from pathlib import Path
          raw = Path('VERSION').read_text(encoding='utf-8').strip()
          ver = raw.split('.') + ['0']
          ver = tuple(int(x) for x in ver[:4])
          vs = '.'.join(map(str, ver))
          text = f'''VSVersionInfo(
            ffi=FixedFileInfo(
              filevers={ver}, prodvers={ver}, mask=0x3f, flags=0x0, OS=0x40004,
              fileType=0x1, subtype=0x0, date=(0, 0)
            ),
            kids=[
              StringFileInfo([
                StringTable('040904B0', [
                  StringStruct('CompanyName', 'Jose-AI'),
                  StringStruct('FileDescription', '恒忆 Evermem 桌面壳'),
                  StringStruct('FileVersion', '{vs}'),
                  StringStruct('InternalName', 'Evermem'),
                  StringStruct('LegalCopyright', 'Copyright (c) 2026 Jose-AI · MIT License'),
                  StringStruct('OriginalFilename', 'Evermem.exe'),
                  StringStruct('ProductName', '恒忆 Evermem'),
                  StringStruct('ProductVersion', '{vs}')
                ])
              ]),
              VarFileInfo([VarStruct('Translation', [1033, 1200])])
            ]
          )'''
          Path('assets/version_info.txt').write_text(text, encoding='utf-8')
          PY

      - name: 构建桌面壳（PySide6 + QtWebEngine，内嵌 Web 服务；单包即完整产品）
        # 单行书写（Windows Git Bash 不吃 \ 续行）；--paths web 让分析器找到 import server；
        # add-data 打包前端资源与模板（冻结态定位见 server.py / desktop.py）。
        # --hidden-import paths：数据/代码目录唯一解析入口，被各模块动态引用，
        # 分析器扫不到会导致打包产物启动即 ModuleNotFoundError。
        run: pyinstaller --onefile --windowed --name Evermem --paths web --hidden-import paths --add-data "web${{ matrix.sep }}web" --add-data "templates${{ matrix.sep }}templates" --add-data "VERSION${{ matrix.sep }}." --add-data "scripts${{ matrix.sep }}scripts" ${{ matrix.icon }} ${{ matrix.version_file }} desktop.py

      - name: GUI 冒烟（--smoke 自退并断言退出码 0）
        shell: bash
        run: |
          # 桌面壳带 --smoke：内嵌服务就绪 + 窗口加载 6s 后自动退出，退出码 0 才算通过
          if [ "${{ matrix.os }}" != "windows-latest" ]; then
            export QT_QPA_PLATFORM=offscreen
            export QTWEBENGINE_CHROMIUM_FLAGS="--no-sandbox --disable-gpu --disable-dev-shm-usage"
          fi
          ./dist/Evermem${{ matrix.exe }} --smoke &
          PID=$!
          rc=""
          i=0
          while [ $i -lt 90 ]; do
            if ! kill -0 "$PID" 2>/dev/null; then wait "$PID"; rc=$?; break; fi
            i=$((i+1)); sleep 1
          done
          if [ -z "$rc" ]; then echo "GUI 超时未退出"; kill "$PID" 2>/dev/null; exit 1; fi
          if [ "$rc" -ne 0 ]; then echo "GUI 冒烟失败 rc=$rc"; exit 1; fi
          echo "GUI 冒烟通过（服务就绪并正常退出）"

      - name: Linux AppImage（可选增强：自带 Qt 库；失败不阻塞发布，见 docs/CODE-SIGNING.md）
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        shell: bash
        run: |
          set -e
          sudo apt-get install -y -qq file desktop-file-utils
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O /tmp/linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O /tmp/linuxdeploy-plugin-qt
          chmod +x /tmp/appimagetool /tmp/linuxdeploy /tmp/linuxdeploy-plugin-qt
          mkdir -p AppDir/usr/bin
          cp dist/Evermem AppDir/usr/bin/evermem
          cat > AppDir/evermem.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Evermem
          Comment=恒忆 Evermem 个人记忆库
          Exec=evermem
          Icon=evermem
          Categories=Utility;
          EOF
          # PySide6 的 Qt 库定位：linuxdeploy-plugin-qt 用 QMAKE 探测（WebEngine 体积大，AppImage 约 200-250MB）
          export QMAKE="$(python -c 'import PySide6, os; print(os.path.join(os.path.dirname(PySide6.__file__), "qmake"))' 2>/dev/null || true)"
          export PATH="/tmp:$PATH"
          ./linuxdeploy --appdir AppDir --executable AppDir/usr/bin/evermem --plugin qt --output appimage \
            -i assets/icon.png \
            || { echo "[appimage] 构建失败（continue-on-error 放行，不影响发布；裸 ELF 仍随 Release 分发）"; exit 0; }
          ls -1 *.AppImage 2>/dev/null || true
          # 放进 dist/ 使其随 Release 上传（重命名步骤只处理 Evermem ELF，不影响 AppImage）
          cp -f *.AppImage dist/ 2>/dev/null || true

      - name: 产物重命名（每平台单个运行包；macOS 打 .app.zip）
        shell: bash
        run: |
          cd dist
          VER="${GITHUB_REF_NAME#v}"
          FILE_VER="$(cat ../VERSION)"
          # 非 tag 触发（workflow_dispatch）时 GITHUB_REF_NAME 是分支名，改用 VERSION 文件
          if [ "$VER" = "${GITHUB_REF_NAME}" ]; then VER="$FILE_VER"; fi
          # tag 与 VERSION 必须一致：不一致说明漏改版本号，直接失败而不是产出错误版本号
          if [ "$VER" != "$FILE_VER" ]; then
            echo "tag 与 VERSION 不一致：tag=$VER VERSION=$FILE_VER"; exit 1
          fi
          if [ "${{ matrix.label }}" = "macos" ]; then
            # macOS onefile 同时产出裸可执行文件与 .app 目录；gh 不能上传目录，把 .app 打成 zip
            zip -qry Evermem-macos-v$VER.app.zip Evermem.app
            rm -rf Evermem.app Evermem
          else
            mv -f Evermem${{ matrix.exe }} Evermem-${{ matrix.label }}-v$VER${{ matrix.exe }}
          fi
          # 生成校验文件（先写清单，避免把自己算进去）
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS.txt
          else
            shasum -a 256 * > SHA256SUMS.txt
          fi
          ls -1

      - name: 生成更新清单片段（本平台资产 + sha256）
        shell: bash
        # 片段写在仓库根，不写进 dist/：dist/* 会整体上传为 Release 资产，不能混入清单文件
        run: |
          python scripts/gen_update_manifest.py fragment \
            --platform ${{ matrix.plat }} --dist dist \
            --version "$(cat VERSION)" --out update-fragment.json

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # uses 步骤不受 defaults.working-directory 影响，路径相对仓库根
          path: |
            dist/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.label }}
          path: update-fragment.json
          if-no-files-found: error

      - name: 确保 GitHub Release 存在（tag 触发时自动创建）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Evermem (恒忆) v${TAG#v} · 桌面壳" --generate-notes
          fi

      - name: 上传二进制到 Release（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          gh release upload "${GITHUB_REF_NAME}" * --clobber

  # 更新清单必须等三平台都构建完才能汇总（要拿齐全平台的 sha256）
  manifest:
    name: 汇总更新清单
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          path: fragments
          merge-multiple: true

      - name: 合成更新清单 update-manifest.json
        run: |
          ls -1 fragments
          # 输出名带前缀：避免与客户端的更新源配置 update.json 同名（开发态两者会落在同一目录）
          # 清单不进仓库：它由 Release 附件分发，需要自建源时由维护者上传到自己的静态服务器
          python scripts/gen_update_manifest.py merge \
            --fragments fragments --version "$(cat VERSION)" \
            --out update-manifest.json --changelog CHANGELOG.md \
            --mirror https://gh-proxy.com/ --mirror https://cdn.gh-proxy.org/
          cat update-manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: Evermem-update-manifest
          path: update-manifest.json
          if-no-files-found: error

      - name: 上传清单到 Release（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" update-manifest.json --clobber
      # 到此为止。清单不再提交回仓库（此前为"让 jsDelivr 直读"而 commit back，
      # 既污染仓库历史，又把发布流程绑在第三方 CDN 上；项目没有 CDN，也不需要）。
      # 自建源的用法：把本步骤产出的附件传到自己的静态服务器，再在界面填清单地址。

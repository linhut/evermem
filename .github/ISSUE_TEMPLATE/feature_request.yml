name: 功能建议 · Feature request
description: 提出新功能、改进建议或平台适配需求
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        中英文均可，中文优先。建议前请先想清楚**要解决的问题**，而不是直接跳到实现方案。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前自查
      options:
        - label: 我已搜索过已有 Issue 与 README，确认不是已支持或已规划的功能
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述当前遇到的不便或缺失的能力，不要只写"希望增加 X 功能"
      placeholder: |
        我在三台机器上都有恒忆，但不知道哪台上有最新的某条经验，
        每次都要手动对比……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法（可选）
      description: 如果有具体想法，写在这里；没有也没关系
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案（可选）
      description: 比如"目前只能用外置脚本绕过去，但每次都要手动跑"
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: 建议类别
      options:
        - 记忆引擎（检索 / 收割 / 索引）
        - 界面与交互
        - 备份与同步
        - 宿主接入（新工具支持）
        - 文档与安装体验
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: 是否了解项目约束
      description: 恒忆坚持「零第三方依赖 · 全本地 · 不依赖宿主钩子」
      options:
        - label: 我理解零依赖与全本地是硬约束，方案应尽量在这两个前提下成立
          required: false

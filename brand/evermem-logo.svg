<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!--
    恒忆 Evermem 品牌 Logo · 主版（彩色 · 透明底）
    寓意：三条经验弧（多会话/多来源）从三个方向注入，汇聚于中心"记忆晶核"（菱形），
          象征经验自动进库、跨会话复用、核心沉淀。金色节点 = 经验注入点。
    设计规范见 docs/BRAND.md
  -->
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6FA0FF"/>
      <stop offset="1" stop-color="#2B4FD8"/>
    </linearGradient>
  </defs>

  <!-- 记忆底座：半透明细环（承载核心的记忆库） -->
  <circle cx="256" cy="256" r="150" stroke="#4A7DFF" stroke-width="10" opacity="0.18"/>

  <!-- 三条经验弧（r=200，每段 100°，间隙 20°） -->
  <path d="M 221.3 453.0 A 200 200 0 0 1 68.1 187.6"
        stroke="#4A7DFF" stroke-width="52" stroke-linecap="round"/>
  <path d="M 102.8 127.4 A 200 200 0 0 1 409.2 127.4"
        stroke="#2B3E8F" stroke-width="52" stroke-linecap="round"/>
  <path d="M 443.9 187.6 A 200 200 0 0 1 290.7 453.0"
        stroke="#4A7DFF" stroke-width="52" stroke-linecap="round"/>

  <!-- 注入点（金：经验入口） -->
  <circle cx="221.3" cy="453.0" r="26" fill="#FFB84D"/>
  <circle cx="102.8" cy="127.4" r="26" fill="#FFB84D"/>
  <circle cx="443.9" cy="187.6" r="26" fill="#FFB84D"/>

  <!-- 记忆晶核：圆角菱形（核心经验） -->
  <rect x="196" y="196" width="120" height="120" rx="18"
        transform="rotate(45 256 256)" fill="url(#core)"/>
</svg>

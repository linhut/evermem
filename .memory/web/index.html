<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>恒忆 Evermem · 记忆管理</title>
<style>
  :root{
    --bg:#F7F8FA; --card:#FFFFFF; --card2:#FAFBFC; --border:#E5E7EB; --text:#1F2937; --text2:#6B7280;
    --blue:#185FA5; --blue-h:#0C447C; --blue-bg:#E6F1FB; --blue-400:#378ADD; --blue-200:#85B7EB;
    --green:#0F6E56; --green-bg:#E1F5EE; --teal:#1D9E75;
    --orange:#854F0B; --orange-bg:#FAEEDA; --gold:#854F0B; --gold-bg:#FAEEDA;
    --red:#791F1F; --red-bg:#FCEBEB; --gray:#5F5E5A; --gray-bg:#F1EFE8;
    --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.04);
    --glass:rgba(255,255,255,.8);
  }
  html[data-theme=dark]{
    --bg:#1A1A1A; --card:#242424; --card2:#2A2A2A; --border:#3D3D3D; --text:#F5F7FA; --text2:#A1A1A6;
    --blue:#85B7EB; --blue-h:#B5D4F4; --blue-bg:#0C447C; --blue-400:#378ADD; --blue-200:#85B7EB;
    --green:#5DCAA5; --green-bg:#085041; --teal:#5DCAA5;
    --orange:#FAC775; --orange-bg:#633806; --gold:#FAC775; --gold-bg:#633806;
    --red:#F09595; --red-bg:#501313; --gray:#B4B2A9; --gray-bg:#2E2E2E;
    --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.5);
    --glass:rgba(36,36,36,.82);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;transition:background .25s}
  #app{display:flex;height:100vh}
  aside{width:212px;background:var(--card);border-right:1px solid var(--border);
        display:flex;flex-direction:column;padding:14px 10px;flex-shrink:0}
  .logo{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:700;color:var(--text);padding:4px 12px 16px}
  .logo svg{flex-shrink:0;filter:drop-shadow(0 1px 2px rgba(10,132,255,.35))}
  .nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;
       color:var(--text2);font-size:13.5px;margin-bottom:2px;transition:all .15s;border:none;background:none;text-align:left;width:100%;font-family:inherit}
  .nav:hover{background:var(--gray-bg)}
  .nav.active{background:var(--blue);color:#fff;font-weight:600}
  .nav svg{width:17px;height:17px;fill:currentColor;flex-shrink:0}
  aside .spacer{flex:1}
  .foot{font-size:10.5px;color:var(--text2);padding:10px 12px;line-height:1.6}
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  header{display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--glass);
         backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
         border-bottom:1px solid var(--border);position:relative;z-index:5}
  header h1{font-size:15px;font-weight:600;white-space:nowrap}
  .search{flex:1;max-width:400px;background:var(--bg);border:1px solid transparent;border-radius:10px;
          padding:7px 14px;font-size:13px;color:var(--text);outline:none;transition:all .2s}
  .search:focus{background:var(--card);border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
  .icon-btn{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:7px 10px;cursor:pointer;color:var(--text2);transition:all .15s;display:flex;align-items:center}
  .icon-btn:hover{color:var(--blue);border-color:var(--blue)}
  .icon-btn svg{width:15px;height:15px;fill:currentColor}
  .btn{border:none;border-radius:9px;padding:7px 16px;font-size:13px;cursor:pointer;transition:all .15s;font-family:inherit}
  .btn.primary{background:var(--blue);color:#fff;font-weight:500}
  .btn.primary:hover{background:var(--blue-h)}
  .btn.ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
  .btn.ghost:hover{border-color:var(--blue);color:var(--blue)}
  #content{flex:1;overflow:auto;padding:20px 22px;display:flex;gap:18px}
  .col{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .list-col{width:38%;min-width:320px;display:flex;flex-direction:column;overflow:hidden}
  .detail-col{flex:1;overflow:hidden;display:flex;flex-direction:column}
  .list-head{padding:12px 16px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text2)}
  #noteList{flex:1;overflow:auto;padding:8px}
  .note-item{padding:10px 12px;border-radius:9px;cursor:pointer;margin-bottom:3px;transition:background .12s,transform .1s}
  .note-item:hover{background:var(--gray-bg)}
  .note-item:active{transform:scale(.99)}
  .note-item.active{background:var(--blue);color:#fff}
  .note-item .t{font-size:13px;font-weight:500;line-height:1.4}
  .note-item .m{font-size:11px;color:var(--text2);margin-top:3px}
  .note-item.active .m{color:rgba(255,255,255,.85)}
  .badge{display:inline-block;padding:1px 8px;border-radius:9px;font-size:10.5px;margin-right:4px}
  .detail-top{padding:16px 22px 8px;overflow:auto;flex:1}
  .detail-top h2{font-size:19px;margin-bottom:8px;line-height:1.35}
  #body{color:var(--text);line-height:1.75;font-size:13.5px;margin-top:12px}
  #body h3{font-size:15px;margin:14px 0 6px}
  #body h4{font-size:13.5px;margin:12px 0 4px}
  #body p{margin:5px 0}
  #body pre{background:var(--gray-bg);padding:8px;border-radius:8px;font-size:12px;overflow:auto}
  .meta{font-size:11px;color:var(--text2);margin:6px 0;word-break:break-all}
  .opbar{display:flex;gap:8px;padding:12px 22px;border-top:1px solid var(--border);flex-wrap:wrap}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;width:100%}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);transition:transform .15s}
  .stat-card:hover{transform:translateY(-2px)}
  .stat-card .n{font-size:26px;font-weight:700;color:var(--blue)}
  .stat-card .l{font-size:11.5px;color:var(--text2);margin-top:4px}
  .hot-card{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);
            border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:8px;box-shadow:var(--shadow)}
  .pane{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
  .pane h3{font-size:14px;margin-bottom:8px}
  .pane .sub{font-size:12px;color:var(--text2);line-height:1.7}
  .host-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
  .host-row:last-child{border-bottom:none}
  .host-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .dot-ok{background:var(--green)} .dot-no{background:var(--gray)}
  select,input[type=text]{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:7px 12px;
       font-size:13px;color:var(--text);outline:none;font-family:inherit}
  select:focus,input[type=text]:focus{border-color:var(--blue)}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap}
  .empty{color:var(--text2);text-align:center;padding:40px 10px;font-size:12.5px}
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;align-items:center;justify-content:center;z-index:99;backdrop-filter:blur(4px)}
  .modal-mask.show{display:flex}
  .modal{background:var(--card);border-radius:16px;width:580px;max-width:92vw;padding:22px 24px;box-shadow:var(--shadow)}
  .modal h3{margin-bottom:14px}
  .modal label{display:block;font-size:12px;color:var(--text2);margin:10px 0 4px}
  .modal input,.modal textarea,.modal select{width:100%;border:1px solid var(--border);border-radius:9px;padding:8px 12px;
        font-size:13px;font-family:inherit;outline:none;background:var(--card);color:var(--text)}
  .modal input:focus,.modal textarea:focus,.modal select:focus{border-color:var(--blue)}
  .modal textarea{height:160px;resize:vertical}
  .modal .row{display:flex;gap:10px}
  .modal .row>*{flex:1}
  .modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);
         padding:9px 18px;border-radius:10px;font-size:12.5px;opacity:0;pointer-events:none;transition:all .3s;z-index:100}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  pre.out{background:var(--gray-bg);border-radius:8px;padding:10px;font-size:11.5px;overflow:auto;max-height:200px;white-space:pre-wrap;line-height:1.5}
  /* ===== 美工细节 ===== */
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:rgba(128,128,134,.35);border-radius:5px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--blue);background-clip:content-box}
  ::-webkit-scrollbar-track{background:transparent}
  .note-item.active .badge{background:rgba(255,255,255,.22);color:#fff}
  .detail-top{animation:fadeIn .18s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .pane,.stat-card,.hot-card{transition:border-color .15s,transform .15s}
  .pane:hover{border-color:var(--blue-bg)}
  .note-item{position:relative}
  .empty{display:flex;flex-direction:column;align-items:center;gap:8px}
  .empty::before{content:"🗂";font-size:26px;opacity:.5}
  #viewTitle{letter-spacing:.2px}
  .nav.active svg{filter:drop-shadow(0 0 2px rgba(255,255,255,.4))}
  .opbar .btn{backdrop-filter:blur(4px)}
  /* ===== 大厂化过渡与精致细节 ===== */
  :root{--ease:cubic-bezier(.4,0,.2,1);--dur:.18s}
  .nav{transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
  .nav:hover{background:var(--blue-bg);color:var(--blue-h)}
  .nav.active:hover{background:var(--blue);color:#fff}
  .btn{transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease),transform .12s var(--ease);will-change:transform}
  .btn:active{transform:scale(.96)}
  .note-item{transition:background var(--dur) var(--ease),transform .12s var(--ease)}
  .note-item:active{transform:scale(.985)}
  .pane,.stat-card,.hot-card{transition:transform var(--dur) var(--ease),border-color var(--dur) var(--ease)}
  .pane:hover,.stat-card:hover,.hot-card:hover{transform:translateY(-1px);border-color:var(--blue-200)}
  #content{animation:fadeIn .22s var(--ease)}
  .detail-top{animation:fadeIn .22s var(--ease)}
  .search{transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease),background var(--dur) var(--ease)}
  .search:focus{box-shadow:0 0 0 3px var(--blue-bg)}
  .modal-mask{transition:opacity .18s var(--ease)}
  .modal{transform:translateY(10px) scale(.985);transition:transform .22s var(--ease),opacity .18s var(--ease)}
  .modal-mask.show .modal{transform:none}
  .detail-top h2{font-size:20px;letter-spacing:.2px}
  #body{color:var(--text);line-height:1.9}
  .stat-card .n{font-variant-numeric:tabular-nums}
  .note-item .m{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .badge{line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="logo">
  <svg viewBox="0 0 34 34" width="26" height="26">
    <defs>
      <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#185FA5"/><stop offset="1" stop-color="#378ADD"/>
      </linearGradient>
    </defs>
    <rect x="1.5" y="1.5" width="31" height="31" rx="9" fill="url(#lg)"/>
    <path d="M17 8.5a8.5 8.5 0 1 1-7.4 4.3" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M17 8.5V5M17 8.5h3.5" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M23.2 22.4l.9 2 2.2.3-1.6 1.6.4 2.2-1.9-1-1.9 1 .4-2.2-1.6-1.6 2.2-.3z" fill="#FFD60A"/>
  </svg>
  恒忆 <span style="font-weight:400;font-size:12px;color:var(--text2)">Evermem</span>
</div>
    <button class="nav active" data-view="browse"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm4 3h8v2H8zm0 4h5v2H8z"/></svg>记忆浏览</button>
    <button class="nav" data-view="triage"><svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>候选审核</button>
    <button class="nav" data-view="import"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-7-7z"/></svg>文档导入</button>
    <button class="nav" data-view="hot"><svg viewBox="0 0 24 24"><path d="M12 2s5 4.5 5 9a5 5 0 0 1-10 0c0-1.6.8-3.2 2-4.5C9.4 8.7 9 10 9 11a3 3 0 0 0 6 0c0-3-3-6-3-6-3-3 2-6 5-6 9a9 9 0 0 0 18 0c0-7-6-12-6-12z"/></svg>核心经验</button>
    <button class="nav" data-view="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10h4v10zm6 0V4h4v16zm6 0v-7h4v7z"/></svg>统计诊断</button>
    <button class="nav" data-view="integ"><svg viewBox="0 0 24 24"><path d="M9 8V6a3 3 0 0 1 6 0v2h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2zm2 0h2V6a1 1 0 0 0-2 0z"/></svg>接入设置</button>
    <button class="nav" data-view="backup"><svg viewBox="0 0 24 24"><path d="M12 3a7 7 0 0 0-5 11.6l1.4-1.4A5 5 0 1 1 12 7a5 5 0 0 1 4.5 2.9L18 11a7 7 0 0 0-6-8zm0 4-3 3h2v4h2v-4h2zm5 6-3 3h2v4h2v-4h2z"/></svg>数据备份</button>
    <div class="spacer"></div>
    <div class="foot">Jose-AI · MIT<br>本地 · 零云端</div>
  </aside>
  <main>
    <header>
      <h1 id="viewTitle">记忆浏览</h1>
      <input id="search" class="search" placeholder="搜索记忆…（融合通信 / 方案 / 公文）" style="display:none">
      <button class="btn ghost" id="allBtn" style="display:none">含候选</button>
      <button class="btn primary" id="newBtn" style="display:none">＋ 新建</button>
      <div style="flex:1"></div>
      <button class="icon-btn" id="themeBtn" title="切换明暗"><svg id="themeIco" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></button>
    </header>
    <div id="content"></div>
  </main>
</div>
<div class="modal-mask" id="modalMask"><div class="modal">
  <h3 id="modalTitle">新建记忆</h3>
  <label>标题</label><input id="fTitle" placeholder="一句话标题">
  <div class="row">
    <div><label>类型</label><select id="fType"><option value="lesson">经验</option><option value="procedure">配方</option><option value="fact">事实</option></select></div>
    <div><label>状态</label><select id="fStatus"><option value="staged">staged（候选）</option><option value="active">active</option><option value="suspect">suspect</option><option value="superseded">superseded</option></select></div>
  </div>
  <label>标签（逗号分隔）</label><input id="fTags" placeholder="方案, 应急">
  <label>正文（Markdown）</label><textarea id="fBody" placeholder="问题 → 无效做法 → 已验证做法 → 适用范围"></textarea>
  <div class="actions"><button class="btn ghost" id="cancelBtn">取消</button><button class="btn primary" id="saveBtn">保存</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script src="index.js"></script>
</body>
</html>
